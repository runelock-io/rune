# rune-operator credentials
#
# DO NOT commit this file with real values.
# secret.yaml is listed in .gitignore — use that filename.
#
# Quickest setup (no file needed):
#
#   kubectl create namespace rune-system
#   kubectl create secret generic rune-operator-credentials \
#     --namespace rune-system \
#     --from-literal=RUNE_SERVER="http://<your-rune-server>:2710" \
#     --from-literal=RUNE_TOKEN="rnk_<your-token>"
#   kubectl apply -f config/operator/deploy.yaml
#
# Or use the setup script (interactive, handles everything):
#
#   bash config/operator/setup.sh
#
# Or fill in this file and apply both manifests in one command:
#
#   kubectl apply -f config/operator/secret.yaml -f config/operator/deploy.yaml
#
---
apiVersion: v1
kind: Namespace
metadata:
  name: rune-system
---
apiVersion: v1
kind: Secret
metadata:
  name: rune-operator-credentials
  namespace: rune-system
type: Opaque
stringData:
  RUNE_SERVER: "http://<your-rune-server>:2710"
  RUNE_TOKEN: "rnk_<your-token>"
