# Copy this file to secret.yaml, fill in your values, and apply it BEFORE deploy.yaml.
# Never commit secret.yaml to version control.
#
#   kubectl apply -f config/operator/secret.yaml
#   kubectl apply -f config/operator/deploy.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: rune-operator-credentials
  namespace: rune-system
type: Opaque
stringData:
  RUNE_SERVER: "http://<your-rune-server-host>:2710"
  RUNE_TOKEN: "<your-rune-system-token>"
