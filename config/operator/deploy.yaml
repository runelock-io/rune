---
apiVersion: v1
kind: Namespace
metadata:
  name: rune-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rune-operator
  namespace: rune-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rune-operator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rune-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rune-operator
subjects:
  - kind: ServiceAccount
    name: rune-operator
    namespace: rune-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rune-operator
  namespace: rune-system
  labels:
    app: rune-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rune-operator
  template:
    metadata:
      labels:
        app: rune-operator
    spec:
      serviceAccountName: rune-operator
      terminationGracePeriodSeconds: 30
      containers:
        - name: rune-operator
          image: ghcr.io/runelock-io/rune-operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RUNE_SERVER
              valueFrom:
                secretKeyRef:
                  name: rune-operator-credentials
                  key: RUNE_SERVER
            - name: RUNE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rune-operator-credentials
                  key: RUNE_TOKEN
            - name: SYNC_INTERVAL
              value: "60s"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            exec:
              command: ["cat", "/tmp/rune-operator-healthy"]
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["cat", "/tmp/rune-operator-healthy"]
            initialDelaySeconds: 5
            periodSeconds: 10
